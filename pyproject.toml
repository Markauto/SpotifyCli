[project]
name = "spotify-cli"
version = "0.1.0"
description = "Local CLI for managing a Spotify account (playlists, search, library, queue) — built to be driven by a human shell or an AI coding agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.5",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.scripts]
spotify = "spotify_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
